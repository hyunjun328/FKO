# 매일 UFC 예정 일정을 수집해 운영자 검수 파일로 보관하는 작업
name: Collect UFC schedule for review

on:
  schedule:
    - cron: "20 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect public schedule data
        run: python scripts/collect_wikipedia.py
      - name: Upload review file
        uses: actions/upload-artifact@v4
        with:
          name: pending-ufc-events
          path: review/pending-events.json
          retention-days: 14
