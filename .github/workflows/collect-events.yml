# 매일 UFC 예정 일정을 수집해 운영자 검수 파일로 보관하는 작업
name: Collect UFC schedule for review

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect public schedule data
        run: python scripts/collect_wikipedia.py
      - name: Collect completed event results
        run: python scripts/collect_ufc_results.py
      - name: Update visible check time
        run: node scripts/write-schedule-status.mjs
      - name: Commit visible check time
        run: |
          if git diff --quiet -- app/data/schedule-status.ts app/data/event-results.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/schedule-status.ts app/data/event-results.ts
          git commit -m "chore(schedule): refresh schedule and results"
          git push
      - name: Upload review file
        uses: actions/upload-artifact@v4
        with:
          name: pending-ufc-events
          path: review/pending-events.json
          retention-days: 14
