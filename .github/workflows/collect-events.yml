# 매일 UFC 예정 일정을 수집해 운영자 검수 파일로 보관하는 작업
name: Refresh UFC schedule and results

on:
  schedule:
    - cron: "0 3,15 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
      - name: Collect public schedule data
        run: python scripts/collect_wikipedia.py
      - name: Collect upcoming UFC events
        run: python scripts/collect_ufc_schedule.py
      - name: Collect completed event results
        run: python scripts/collect_ufc_results.py
      - name: Collect missing scheduled fighter photos
        run: python scripts/collect_fighter_images.py
      - name: Update visible check time
        run: node scripts/write-schedule-status.mjs
      - name: Commit refreshed public data
        id: commit
        run: |
          git add app/data/schedule-status.ts app/data/auto-scheduled-events.ts app/data/event-results.ts app/data/fighter-images.json public/fighters
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(schedule): refresh UFC schedule and results"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy refreshed site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
      - name: Upload review file
        uses: actions/upload-artifact@v4
        with:
          name: pending-ufc-events
          path: review/pending-events.json
          retention-days: 14
