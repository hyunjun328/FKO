# 공개 라이선스 선수 사진을 하루 한 번 수집해 사이트에 반영한다.
name: Refresh fighter photos

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
      - name: Collect verified fighter photos
        run: python scripts/collect_fighter_images.py --include-world-ranking
      - name: Commit refreshed fighter photos
        id: commit
        run: |
          git add app/data/fighter-images.json public/fighters
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(photos): refresh fighter photos"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy refreshed site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
