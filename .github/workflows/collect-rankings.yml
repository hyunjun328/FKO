name: Refresh rankings and fighter photos

on:
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
      - name: Collect Fight Matrix rankings
        run: python scripts/collect_fightmatrix_rankings.py
      - name: Collect verified fighter photos
        run: python scripts/collect_fighter_images.py --include-world-ranking
      - name: Commit refreshed rankings and photos
        run: |
          git add app/data/fightmatrix-rankings.ts app/data/fighter-images.json public/fighters
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(rankings): refresh rankings and photos"
          git push
